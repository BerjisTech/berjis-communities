
  <header class="sticky top-[-25px] z-50 bg-radial-[at_0%_100%] from-blue-50 to-slate-50 dark:from-blue-900 dark:to-slate-900 text-blue-900 shadow shadow-blue-100 dark:shadow-blue-900 dark:text-blue-50 px-6 py-4"><h1 class="m-0 text-xl font-semibold">Explore</h1></header>
  <main class="max-w-4xl mx-auto p-6">
    <input placeholder="#hashtag" [(ngModel)]="tag" (keyup.enter)="search()" class="px-2 py-2 border border-gray-300 rounded-md" />
    <button (click)="search()" class="ml-2 px-3 py-2 border rounded-md">Search</button>
    <div *ngIf="loading">Loading…</div>
    <article *ngFor="let p of posts" style="border:1px solid #e5e7eb;border-radius:8px;padding:12px;margin:8px 0">
      <div style="font-weight:600" [innerText]="p.title"></div>
      <div [innerHTML]="render(p.body)"></div>
    </article>
  </main>
