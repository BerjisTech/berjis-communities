<div class="grid grid-cols-4 h-screen w-full overflow-hidden p-0 m-0">
  <div #leftSideBar class="col-span-1 h-screen overflow-y-auto overflow-x-hidden">
    <div #userAvatar class="h-[200px] flex items-center justify-center" *ngIf="currentUser">
      <app-user-avatar [id]="currentUser?.id || currentUser?.uuid" [src]="userAvatar" [size]="150"></app-user-avatar>
    </div>
    <div class="flex items-center justify-center gap-6 py-2" *ngIf="currentUser">
      <button class="text-center" (click)="openFollowers()">
        <div class="text-lg font-bold">{{ followerCount }}</div>
        <div class="text-xs uppercase tracking-wide text-slate-500">Followers</div>
      </button>
      <button class="text-center" (click)="openFollowing()">
        <div class="text-lg font-bold">{{ followingCount }}</div>
        <div class="text-xs uppercase tracking-wide text-slate-500">Following</div>
      </button>
      <a class="text-center" routerLink="/me/posts">
        <div class="text-lg font-bold">{{ postsCount }}</div>
        <div class="text-xs uppercase tracking-wide text-slate-500">Posts</div>
      </a>
    </div>
    <div #userName class="flex flex-col items-center justify-center text-center" *ngIf="currentUser">
      <span class="font-black text-xl">{{ userDisplayName }}</span>
      <span class="font-light text-slate-600" *ngIf="userHandle">{{ userHandle }}</span>
    </div>
    <div #navLinksRef
      class="h-[calc(100vh-650px)] !min-h-[320px] w-[300px] mx-auto overflow-y-auto overflow-x-hidden flex flex-col px-2">
      <a *ngIf="!currentUser" href="http://berjis.tech/account" class="rounded-lg p-3 mb-2 flex items-center justify-center gap-2 w-full bg-blue-600 text-white">
        <span class="material-symbols-outlined">login</span>
        <span>Sign In</span>
      </a>
      <a [routerLink]="link.url" *ngFor="let link of navLinks"
        class="rounded-lg p-3 flex items-center justify-start gap-2 w-full"
        routerLinkActive="!bg-slate-800 !text-slate-100"
        [routerLinkActiveOptions]="link.url === '/' ? { exact: true } : { exact: false }">
        <span class="material-symbols-outlined">{{link.icon}}</span>
        <span>{{link.name}}</span>
      </a>
    </div>
    <div #ads class="mx-auto w-[250px] flex items-center justify-center h-[250px]">
      <div class="relative w-full h-full border-[2px] border-dashed border-orange-400 rounded-md">
        <div class="w-[100px] h-[100px] absolute bottom-[-25px] left-[-25px] shadow bg-gradient-to-tl from-teal-400 to-cyan-300 rounded-full"></div>
        <div
          class="w-[100px] h-[100px] absolute top-[-20px] right-[-20px] shadow bg-gradient-to-r from-rose-400 to-orange-300 rounded-full">
        </div>
        <div class="w-[150px] h-[150px] absolute top-[50px] right-[50px] rounded-xl shadow bg-green-200"></div>
        <div class="w-[50px] h-[50px] absolute top-[25px] left-[25px] shadow bg-gradient-to-r from-yellow-400 to-amber-500 rounded-full"></div>
        <div class="w-[50px] h-[50px] absolute bottom-[25px] right-[25px] shadow bg-gradient-to-t from-green-400 to-emerald-300 rounded-full"></div>
      </div>
    </div>
  </div>
  <div #mainContent class="col-span-2">
    <router-outlet></router-outlet>
  </div>
  <div #rightSideBar class="col-span-1 h-screen overflow-y-auto overflow-x-hidden">
    <div #stories *ngIf="currentUser" class="px-2 py-2">
      <app-story-strip [me]="currentUser"></app-story-strip>
    </div>
    <div #suggestions></div>
    <div #recommendations></div>
    <div class="flex items-center gap-2">
      <a href="http://berjis.tech/account"
        class="px-3 py-2 rounded-md border border-gray-300 bg-white/90 backdrop-blur hover:bg-gray-100 dark:bg-slate-800 dark:text-white">Account</a>
      <button (click)="toggleTheme()" title="Toggle theme"
        class="px-3 py-2 rounded-md border border-gray-300 bg-white/90 backdrop-blur dark:bg-slate-800 dark:text-white">
        {{ isDark ? 'Light' : 'Dark' }}
      </button>
    </div>
  </div>
</div>

<!-- Followers/Following Modal -->
<div *ngIf="showFollowers || showFollowing" class="fixed inset-0 bg-black/50 flex items-center justify-center z-50">
  <div class="bg-white dark:bg-slate-900 w-[480px] max-h-[80vh] rounded-lg shadow-xl overflow-hidden">
    <div class="flex items-center justify-between px-4 py-3 border-b border-slate-200 dark:border-slate-700">
      <div class="font-semibold">{{ showFollowers ? 'Followers' : 'Following' }}</div>
      <button class="text-slate-500" (click)="closeModals()">✕</button>
    </div>
    <div class="overflow-y-auto max-h-[70vh]">
      <div *ngFor="let id of (showFollowers ? followers : following)" class="flex items-center justify-between px-4 py-3 border-b border-slate-100 dark:border-slate-800">
        <div class="flex items-center gap-3">
          <img [src]="userAvatarById(id)" class="w-8 h-8 rounded-full"/>
          <div class="text-sm">{{ userName(id) }}</div>
        </div>
        <div class="flex items-center gap-2">
          <button *ngIf="showFollowers" class="text-xs px-2 py-1 rounded border" (click)="removeFollower(id)">Remove</button>
          <button class="text-xs px-2 py-1 rounded" [ngClass]="isFollowing(id) ? 'bg-slate-200 dark:bg-slate-700' : 'bg-blue-600 text-white'" (click)="toggleFollow(id)">
            {{ isFollowing(id) ? 'Following' : 'Follow' }}
          </button>
        </div>
      </div>
    </div>
  </div>
  </div>
