<form [formGroup]="form" (ngSubmit)="onSubmit()"
  class="rounded-lg p-3 shadow mb-2 bg-white/90 text-slate-900 dark:bg-slate-900/80 dark:text-slate-100">
  <input formControlName="title" placeholder="Title (optional for text-only)"
    class="w-full shadow rounded p-2 outline-none bg-white/90 text-slate-900 dark:bg-slate-950 dark:text-slate-100 hidden">
  <div class="relative">
    <textarea #bodyArea rows="6" formControlName="body" (input)="onBodyInput($event)"
      placeholder="Write something... type # to add tags"
      class="w-full shadow rounded p-2 h-[50px] outline-none bg-white/90 text-slate-900 focus:outline-none dark:bg-slate-950 dark:text-slate-100"></textarea>
    <ng-container *ngIf="(suggest$ | async) as sugg">
      <div *ngIf="sugg.length > 0"
        class="absolute left-[8px] right-[8px] bottom-[-2px] transform translate-y-[100%] bg-white border-[1px] border-solid border-[#e5e7eb] rounded-[6px] box-shadow-[0_4px_12px_rgba(0,0,0,0.06)] z-[10]">
        <div *ngFor="let s of sugg" (click)="insertTag(s.name)"
          class="px-[6px] py-[8px] flex justify-between cursor-pointer">
          <span>#{{s.name}}</span>
          <small class="text-[#6b7280]">{{s.count}}</small>
        </div>
      </div>
    </ng-container>
  </div>
  <div class="flex items-center gap-2 w-full">
    <label for="postMedia" class="cursor-pointer">
      <input #postMedia id="postMedia" type="file" name="postMedia" class="hidden" multiple (change)="pickFiles($event)"
        accept="png,jpg,webp,mov,wav,mp3,mp4,gif" />
      <div class="flex items-center gap-2"><span class="material-symbols-outlined">image_inset</span> Media
      </div>
    </label>
    <div *ngIf="!communityId && !groupId" class="grid grid-cols-1 gap-[12px]">
      <label class="flex items-center gap-2">
        <span class="material-symbols-outlined">Visibility</span>
        <select formControlName="visibility" class="border-none outline-none focus:outline-none">
          <option value="public">Public</option>
          <option value="private">Private</option>
        </select>
      </label>
    </div>
    <span class="flex-grow"></span>
    <button type="submit" [disabled]="(state$ | async)?.submitting"
      class="rounded px-3 h-[30px] btn btn-primary dark:bg-[color:var(--color-gold)] dark:text-slate-100">Post</button>
  </div>
  <div *ngIf="uploads.length" class="grid gap-1 mt-2"
    [ngClass]="{'grid-cols-2': uploads.length>1, 'grid-cols-1': uploads.length===1}">
    <div *ngFor="let u of uploads; let i = index" class="relative">
      <img *ngIf="u.kind!=='video'" [src]="u.url" class="w-full h-40 object-cover rounded" />
      <video *ngIf="u.kind==='video'" [src]="u.url" class="w-full h-40 object-cover rounded" controls></video>
      <button class="absolute top-1 right-1 bg-slate-700/80 rounded px-2" (click)="removeUpload(i)">x</button>
    </div>
  </div>
  <div *ngIf="(state$ | async)?.message as m" class="text-[#065f46]">{{m}}</div>
  <div *ngIf="(state$ | async)?.error as e" class="text-[#991b1b]">{{e}}</div>
</form>
