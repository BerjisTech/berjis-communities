<div class="w-full">
  <div class="flex items-stretch gap-3 overflow-x-auto pb-2">
    <ng-container *ngFor="let it of items">
      <!-- Add card -->
      <div *ngIf="it.type === 'add'" class="flex-none w-[120px] h-[200px] rounded-xl border border-slate-200 bg-white dark:bg-slate-800 shadow-sm p-2 flex flex-col items-center justify-center">
        <button class="w-full py-2 rounded-md bg-blue-600 text-white" (click)="adding = !adding">Add Story</button>
        <div *ngIf="adding" class="w-full mt-2 text-sm">
          <input type="file" accept="image/*,video/*" (change)="onFile($event)" class="w-full text-xs" />
          <input type="text" placeholder="Caption (optional)" [(ngModel)]="caption" class="w-full mt-1 px-2 py-1 rounded border border-slate-300 bg-transparent" />
          <button class="w-full mt-2 py-1 rounded bg-green-600 text-white disabled:opacity-50" (click)="addStory()" [disabled]="submitting || !file">{{ submitting ? 'Posting...' : 'Post' }}</button>
        </div>
      </div>
      <!-- Story card -->
      <div *ngIf="it.type === 'story'" class="relative flex-none w-[120px] h-[200px] rounded-xl border border-slate-200 bg-white dark:bg-slate-800 shadow-sm overflow-hidden">
        <div class="absolute top-1 right-1 text-[10px] px-1.5 py-0.5 rounded-full bg-black/70 text-white" *ngIf="(it.story_count || 0) > 1">{{ it.story_count }}</div>
        <div class="w-full h-[160px] bg-slate-200 dark:bg-slate-700 flex items-center justify-center overflow-hidden">
          <img *ngIf="it.media?.length && it.media[0]?.kind === 'image'" [src]="it.media[0]?.url" alt="story" class="object-cover w-full h-full" />
          <video *ngIf="it.media?.length && it.media[0]?.kind === 'video'" [src]="it.media[0]?.url" class="object-cover w-full h-full" muted autoplay loop playsinline></video>
          <img *ngIf="!it.media?.length" [src]="avatarFor(it.user_id)" class="w-24 h-24 rounded-full"/>
        </div>
        <div class="h-[40px] px-2 text-xs truncate flex items-center gap-1">
          <app-user-avatar [id]="it.user_id" [src]="avatarFor(it.user_id)" [size]="20"></app-user-avatar>
          <span class="truncate">{{ nameFor(it.user_id) || 'User' }}</span>
        </div>
      </div>
    </ng-container>
  </div>
</div>
