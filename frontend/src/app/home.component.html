<main class="max-w-4xl mx-auto p-6 min-h-screen">
  <app-post-create (posted)="onPosted($event)"></app-post-create>
  <section>
    <div class="sticky top-[-25px] z-50 flex items-center justify-between bg-white/90 dark:bg-slate-900/80 backdrop-blur px-2 py-3 text-slate-800 dark:text-slate-200">
      <div class="font-black text-xl">Feed</div>
      <div class="flex items-center justify-end gap-2 text-xs uppercase tracking-[0.3em] text-slate-500 dark:text-slate-400">
        <span>Recent</span>
        <span>Friends</span>
        <span>Popular</span>
      </div>
    </div>
    <div *ngIf="loadingInitial" class="text-center py-6 text-slate-500 dark:text-slate-300">Loading feed...</div>
    <app-post-card *ngFor="let post of posts" [post]="post" [users]="users" [emojis]="emojis"></app-post-card>
    <div *ngIf="loadingMore && !loadingInitial" class="py-6 text-center text-slate-500 dark:text-slate-400">Loading more...</div>
    <div #feedSentinel class="w-full h-1"></div>
    <div *ngIf="endOfFeed && posts.length" class="py-6 text-center text-slate-400 dark:text-slate-500 text-sm">You’re all caught up.</div>
  </section>
</main>
